[project]
name = "py-workflow-system"
version = "0.1.0"
description = "Vibe coding lesson starter project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Server-side .xlsx/.xls parsing for POST /projects/{id}/import
    # (backend/parsers/excel_parser.py). Falls back to CSV if unavailable.
    "openpyxl>=3.1.0",
    # Required by FastAPI for the multipart endpoints (Form / UploadFile) used by
    # POST /projects and POST /projects/{id}/import.
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# ── Ruff (the lint the CI runs: `uv run --with ruff ruff check .`) ────────────
# Ruff's own default rule set is used on purpose, and the CI pins the ruff
# version (see .github/workflows/ci.yml) so a new ruff release cannot silently
# change what "green" means. Only the FastAPI false positive is silenced.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["db", "__pycache__"]

[tool.ruff.lint]
ignore = [
    # FastAPI's documented idiom: Depends(...) / File(...) in argument defaults.
    # Moving them into the function body would break dependency injection.
    "B008",
]
