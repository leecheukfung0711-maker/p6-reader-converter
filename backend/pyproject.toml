[project]
name = "py-workflow-system"
version = "0.1.0"
description = "Vibe coding lesson starter project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Server-side .xlsx/.xls parsing for POST /projects/{id}/import
    # (backend/parsers/excel_parser.py). Falls back to CSV if unavailable.
    "openpyxl>=3.1.0",
    # Required by FastAPI for the multipart endpoints (Form / UploadFile) used by
    # POST /projects and POST /projects/{id}/import.
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
